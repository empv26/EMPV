name: Apply V16 brochure typography (temporary)
on:
  push:
    branches: [feat/presentazione-legibility-20261123]
    paths:
      - ".github/workflows/presentation-v16-apply.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/presentazione-legibility-20261123
          persist-credentials: true
      - name: Replace the V15 readability layer with the V16 slide-specific layer
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,re
          from pathlib import Path
          css=gzip.decompress(base64.b64decode(""))
          assert hashlib.sha256(css).hexdigest()=="3193e3ca7a4552ee52d924223c26fd0056549e81f63991a5db6ccda812157123", "CSS integrity mismatch"
          source=Path("public/presentazione/index.html")
          html=source.read_text(encoding="utf-8")
          pattern=r'<style id="empv-presentation-readability-v15">[\s\S]*?</style>'
          assert len(re.findall(pattern,html))==1, "Expected exactly one V15 layer"
          updated=re.sub(pattern,lambda m:'<style id="empv-presentation-readability-v16">\n'+css.decode("utf-8")+'\n</style>',html,count=1)
          assert updated.count('<section class="slide-frame')==15
          assert '14 — Team EMPV' in updated and '15 — Contatti e collaborazione' in updated
          assert 'data-empv-language' in updated
          source.write_text(updated,encoding="utf-8")
          print("Applied V16, CSS SHA256 verified")
          PY
      - name: Commit only the presentation HTML to development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/presentazione/index.html
          git commit -m "Brochure V16: larger typography and balanced slide composition"
          git push origin HEAD:feat/presentazione-legibility-20261123
