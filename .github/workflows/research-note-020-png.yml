name: Generate Research Note 020 PNG previews
on:
  push:
    paths:
      - '.github/workflows/research-note-020-png.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render bilingual 1200x630 PNG cards
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          root=Path("public/social/research-notes")
          for lang in ("it","en"):
              source=root/f"browser-use-1-python-cdp-{lang}-20261110a.svg"
              target=root/f"browser-use-1-python-cdp-{lang}-20261110a.png"
              cairosvg.svg2png(url=str(source),write_to=str(target),output_width=1200,output_height=630)
          path=Path("src/researchNotesContent.ts")
          text=path.read_text()
          for lang in ("it","en"):
              text=text.replace(f"browser-use-1-python-cdp-{lang}-20261110a.svg",f"browser-use-1-python-cdp-{lang}-20261110a.png")
          path.write_text(text)
          PY
      - name: Commit previews and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/social/research-notes/browser-use-1-python-cdp-*-20261110a.png src/researchNotesContent.ts
          git diff --cached --quiet || (git commit -m "Use PNG social previews for Research Note 020" && git push)
