name: Brochure asset recovery (isolated branch)

on:
  push:
    branches: [feat/brochure-save-unsplash-images]
    paths:
      - ".github/workflows/brochure-save-images.yml"

permissions:
  contents: write

jobs:
  recover-photographs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/brochure-save-unsplash-images
          persist-credentials: true
      - name: Download original Unsplash photographs locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/presentazione/assets
          photos=(
            photo-1450101499163-c8848c66ca85
            photo-1454165804606-c3d57bc86b40
            photo-1460925895917-afdab827c52f
            photo-1497366216548-37526070297c
            photo-1504868584819-f8e8b4b6d7e3
            photo-1512941937669-90a1b58e7e9c
            photo-1551288049-bebda4e38f71
            photo-1552664730-d307ca884978
            photo-1556761175-5973dc0f32e7
            photo-1558494949-ef010cbdcc31
            photo-1581091226825-a6a2a5aee158
            photo-1581092160607-ee22621dd758
            photo-1581092335397-9583eb92d232
            photo-1586528116311-ad8dd3c8310d
            photo-1587202372775-e229f172b9d7
          )
          for photo in "${photos[@]}"; do
            out="public/presentazione/assets/${photo}.jpg"
            echo "Download: $photo"
            width=1600
            if [[ "$photo" == photo-1581091226825-a6a2a5aee158 ]]; then width=1920; fi
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 90 \
              --silent --show-error \
              "https://images.unsplash.com/${photo}?fit=crop&auto=format&fm=jpg&w=${width}&q=87" \
              --output "$out"
            test "$(wc -c < "$out")" -gt 5000
            file "$out" | grep -Eiq 'JPEG|image'
          done
          echo "Verified ${#photos[@]} image files."
      - name: Commit images to the isolated development branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/presentazione/assets
          if ! git diff --cached --quiet; then
            git commit -m "Add 15 original brochure photographs as local assets"
            git push origin HEAD:feat/brochure-save-unsplash-images
          fi
      - name: Upload photo archive for review
        uses: actions/upload-artifact@v4
        with:
          name: empv-brochure-original-photographs
          path: public/presentazione/assets/*.jpg
          if-no-files-found: error
