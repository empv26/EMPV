name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Verify legacy GitHub preview base path
        run: |
          grep -q 'http-equiv="refresh" content="0; url=/EMPV/it/"' dist/index.html
          grep -q 'rel="canonical" href="https://2008hitch-afk.github.io/EMPV/it/"' dist/index.html
      - name: Verify bilingual services and AI Lab routes
        run: node scripts/check-services-static.mjs
      - name: Build production-like browser fixture
        env:
          VITE_SITE_ORIGIN: "https://empv.it"
          VITE_SITE_BASE_PATH: ""
        run: |
          npx vite build --base=/
          node scripts/seo-build.mjs
      - name: Verify presentation package
        run: node scripts/check-presentation-static.mjs
      - name: Verify search and AI crawler readiness
        run: node scripts/check-seo-geo-readiness.mjs
      - name: Install temporary browser QA dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify responsive services in browser
        run: node scripts/check-services-browser.mjs
      - name: Verify multilingual presentation in browser
        run: node scripts/check-presentation-browser.mjs
      - name: Archive responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: services-responsive-qa
          path: |
            ${{ runner.temp }}/empv-services-qa/*.png
            ${{ runner.temp }}/empv-presentation-qa/*.png
          if-no-files-found: ignore
